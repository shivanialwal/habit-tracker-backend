services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: habitdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: habitdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: supersecret_for_dev_changeit
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  pgdata:
